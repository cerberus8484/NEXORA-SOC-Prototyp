# ── SOC Ticket Tool — Lokaler Full-Stack (Dev) ────────────────
#
# Alles in Containern, mit Hot-Reload:
#   Start:   docker compose -f docker-compose.dev.yml up -d
#   Logs:    docker compose -f docker-compose.dev.yml logs -f api web
#   Stoppen: docker compose -f docker-compose.dev.yml down
#
# Danach: Frontend http://localhost:5173 · API http://localhost:3000
# Erster Start dauert (npm install in beiden Containern) — danach
# liegen node_modules in Named Volumes und es geht schnell.
#
# Hinweis: Alle Passwörter/Secrets hier sind NUR für lokale Entwicklung.

name: soc-dev

services:

  # ── PostgreSQL (Dev-Daten) ──────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: soc_postgres_dev
    environment:
      POSTGRES_DB:       soc_tickets_dev
      POSTGRES_USER:     soc_api
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      # The image runs a temporary PostgreSQL process while it initializes a
      # new volume. Do not probe that process: it can delay its clean shutdown.
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = \"postgres\" && pg_isready -U soc_api -d soc_tickets_dev"]
      interval: 5s
      timeout: 5s
      # A brand-new PostgreSQL volume can need more than the default 25 seconds
      # on a resource-constrained Docker host. Do not fail dependent services
      # while initdb is still completing its first-run setup.
      start_period: 90s
      retries: 12

  # ── PostgreSQL (Jest-Integrationstests, Port 5433) ──────────
  postgres_test:
    image: postgres:16-alpine
    container_name: soc_postgres_test
    environment:
      POSTGRES_DB:       soc_tickets_test
      POSTGRES_USER:     soc_api
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(cat /proc/1/comm)\" = \"postgres\" && pg_isready -U soc_api -d soc_tickets_test"]
      interval: 5s
      timeout: 5s
      start_period: 90s
      retries: 12

  # ── Backend API (nodemon, Hot-Reload) ───────────────────────
  # bookworm-slim statt alpine: bcrypt hat glibc-Prebuilds — auf
  # musl müsste es kompilieren (Build-Tools fehlen im Image).
  api:
    image: node:20-bookworm-slim
    container_name: soc_api_dev
    working_dir: /app
    command: sh -c "npm install && npx nodemon --legacy-watch src/server.js"
    environment:
      NODE_ENV:    development
      PORT:        3000
      DB_ENABLED:  "true"
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     soc_tickets_dev
      DB_USER:     soc_api
      DB_PASSWORD: devpassword
      DB_SSL:      "false"
      JWT_SECRET:  dev-only-jwt-secret-niemals-in-prod
      CORS_ORIGINS: http://localhost:5173
      # Initialer Admin (wird nur angelegt wenn nicht vorhanden)
      ADMIN_EMAIL:    admin@nexora.example
      ADMIN_PASSWORD: DevAdmin123!
      WEBHOOK_SECRET_GENERIC: dev-webhook-secret
      LOG_LEVEL: debug
      # Dev runs API and queue in one container. Keep correlation processing in
      # the dedicated worker role so its heartbeat cannot contend with logins.
      CORRELATION_WORKER_ENABLED: "false"
      # Datei-Watching über Windows-Bind-Mounts braucht Polling
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      start_period: 90s
      retries: 5

  # ── Frontend (Vite Dev-Server, HMR) ─────────────────────────
  web:
    image: node:20-bookworm-slim
    container_name: soc_web_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      # Vite-Proxy /api → API-Container (Service-Name im Docker-Netz)
      VITE_API_TARGET: http://api:3000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata_dev:
  pgdata_test:
  api_node_modules:
  web_node_modules:
