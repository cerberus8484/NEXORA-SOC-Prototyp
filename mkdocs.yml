# =============================================================================
# Nexora SOC — Dokumentations-Website (MkDocs Material)
#
# Diese Konfiguration bündelt die vorhandene Doku unter docs/ zu EINER
# durchsuchbaren Website mit linker Navigation — im Stil von
# docs.securityonion.net (Getting Started → Konsole → Detection → Architektur …).
#
# Lokal starten:   python -m mkdocs serve   → http://127.0.0.1:8000
# Bauen:           python -m mkdocs build   → statische Site nach ./site/
# Abhängigkeiten:  pip install -r requirements-docs.txt
# =============================================================================

site_name: Nexora SOC — Dokumentation
site_description: >-
  Self-hosted SOC-Orchestrierungsplattform für Tier 1–3 — Incident-Ticketing,
  Threat Hunting, Evidence/Chain-of-Custody, KI-Triage mit Human-Approval.
site_author: Nexora SOC
docs_dir: docs
site_dir: site
use_directory_urls: true

# --- Theme -------------------------------------------------------------------
theme:
  name: material
  language: de
  # Keine externen Google-Fonts laden → offline-/air-gapped-tauglich (self-hosted SOC).
  font: false
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Zu hellem Design wechseln
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Zu dunklem Design wechseln
  icon:
    logo: material/shield-lock-outline
    repo: fontawesome/brands/github
  features:
    - navigation.indexes      # Sektions-Startseiten (index.md je Ordner)
    - navigation.tracking     # URL folgt der aktiven Überschrift
    - navigation.top          # "nach oben"-Button
    - navigation.footer       # Zurück/Weiter im Footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.tabs.link

# --- Markdown-Erweiterungen --------------------------------------------------
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - def_list
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true
      toc_depth: 3

# --- Plugins -----------------------------------------------------------------
plugins:
  - search:
      lang:
        - de
        - en
  - i18n:
      docs_structure: suffix        # datei.en.md = englische Fassung; ohne Suffix = Deutsch
      fallback_to_default: true     # untersetzte Seiten fallen auf Deutsch zurück
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Start: Home
            "Überblick (Was Nexora macht)": "Overview (What Nexora Does)"
            "Produkt & Funktionsumfang": "Product & Capabilities"
            Feature-Status: Feature Status
            Roadmap: Roadmap
            Installation: Installation
            "Übersicht": "Overview"
            "Migration (alt → neu)": "Migration (old → new)"
            "Bedienung (Analysten-Konsole)": "Usage (Analyst Console)"
            User-Guide: User Guide
            Seiten-Referenz: Page Reference
            Administration: Administration
            "Allgemein & Lizenz": "General & License"
            "Benutzer & Rollen (RBAC)": "Users & Roles (RBAC)"
            Integrationen: Integrations
            "Sicherheit (Auth, MFA, SSO)": "Security (Auth, MFA, SSO)"
            "API & Webhooks": "API & Webhooks"
            Benachrichtigungen: Notifications
            "Speicherung & Retention": "Storage & Retention"
            "Branding & Thema": "Branding & Theme"
            "Audit & Compliance": "Audit & Compliance"
            KI-Agent-Konfiguration: AI Agent Configuration
            Autonomie-Richtlinien: Autonomy Policies
            "Provisioning & Enrollment": "Provisioning & Enrollment"
            Correlation Engine: Correlation Engine
            ML-Evaluation: ML Evaluation
            Detection & Threat Hunting: Detection & Threat Hunting
            Regel-Katalog: Rules Catalog
            Architektur: Architecture
            Korrelations-Datenmodell: Correlation Data Model
            Lokale-LLM-Architektur: Local LLM Architecture
            Server-Implementierungsplan: Server Implementation Plan
            Machine Learning: Machine Learning
            "Integrationen (Referenz)": "Integrations (Reference)"
            "Sicherheit (Konzept & Reviews)": "Security (Concept & Reviews)"
            Sicherheits-Verbindungen: Security Connections
            "Betrieb (Operations)": Operations
            "Netzwerk & Lab": "Network & Lab"
            Entwicklung: Development
            API-Referenz: API Reference
            Agent-Orchestrierung: Agent Orchestration
            "Entscheidungen (ADR)": "Decisions (ADR)"
            Decision Records: Decision Records

# --- Nicht veröffentlichen (operator-privat / interne Planung / veraltet) ----
exclude_docs: |
  /README.md
  01-architecture/uml.md
  01-architecture/uml.html
  00-overview/README.md
  00-overview/abarbeitungsplan-2026-06-27.md
  00-overview/dataplane-inventar-2026-06-25.md
  00-overview/hardening-und-collector-plan-2026-06-26.md
  00-overview/master-roadmap-2026-06-26.md
  00-overview/offene-punkte-2026-06-26.md
  00-overview/schulden-report-2026-06-26.md
  02-user-guide/pages/README.md
  07-operations/network/CHANGELOG-honeypot.md
  _private/
  agent-runs/
  assets/screenshots/README.md
  cost-analysis.md
  dev-journal.md
  plan-montag.md

validation:
  # Navigations-Fehler bleiben sichtbar (fängt eigene Verdrahtungsfehler ab).
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: info
  # Bestandsdocs verlinken bewusst auf Repo-Root-Dateien (README/ROADMAP/CHANGELOG)
  # außerhalb der Site sowie auf handgeschriebene Alt-Anker → als Info, nicht als Warnung.
  links:
    not_found: info
    anchors: info
    absolute_links: info
    unrecognized_links: ignore

