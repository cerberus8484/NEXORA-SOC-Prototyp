#!/usr/bin/env bash
# ─────────────────────────────────────────────────────────────────────────────
# Nexora SOC Lab — zentrale Konfiguration
#
# Alle veraenderlichen Werte an EINER Stelle. Wird von deploy-lab.sh und allen
# Phasen-Scripts per `source` geladen.
#
# SECRETS gehoeren NICHT hier rein. Passwoerter kommen aus Umgebungsvariablen
# (siehe secrets.env.example). Das Script bricht ab, wenn ein noetiges Secret
# fehlt — kein stiller Default.
# ─────────────────────────────────────────────────────────────────────────────

# ── Proxmox / Storage ────────────────────────────────────────────────────────
PVE_STORAGE_VM="VMStorage"          # NFS-Storage fuer VM-Disks + ISOs
PVE_STORAGE_EFI="local-lvm"         # Storage fuer EFI-/TPM-State (lokal, klein)
PVE_ISO_DIR="/mnt/pve/${PVE_STORAGE_VM}/template/iso"
PVE_IMG_DIR="/mnt/pve/${PVE_STORAGE_VM}/template/images"

NFS_SERVER="192.168.240.32"           # WD My Cloud
NFS_EXPORT="/mnt/HD/HD_a2/VM-Storage"

# ── Netzwerk: Bridges ────────────────────────────────────────────────────────
# WAN-Bridge (zu FritzBox). bridge-ports = echter NIC-Name (ip link show).
BR_WAN="vmbr0"
BR_WAN_PORT="eno1"                  # ANPASSEN: onboard NIC
# VLAN-aware LAN-Bridge (traegt alle VLAN-Tags). USB-NICs koennen KEIN 802.1Q!
BR_LAN="vmbr2"
BR_LAN_PORT="enxa0cec87eae16"       # ANPASSEN: onboard NIC fuer VLAN-Trunk
# MGMT-IP des Proxmox-Hosts (VLAN 99)
PVE_MGMT_IP="10.99.98.100"
PVE_MGMT_GW="10.99.98.1"             # MUSS 10.99.98.1 sein (nicht .90 — Tippfehler-Falle)

# ── VLAN / IP-Schema ─────────────────────────────────────────────────────────
VLAN_SERVERS=10 ; NET_SERVERS="10.0.10" ; GW_SERVERS="10.99.99.1"
VLAN_CLIENTS=20 ; NET_CLIENTS="10.0.20" ; GW_CLIENTS="10.0.20.1"
VLAN_PENTEST=30 ; NET_PENTEST="10.0.30" ; GW_PENTEST="10.0.30.1"
VLAN_MGMT=99    ; NET_MGMT="10.0.99"    ; GW_MGMT="10.99.98.1"

# DNS: DC ist autoritativ fuer nexora.example, OPNsense forwardet dorthin
DC_IP="10.99.99.10"
OPN_DNS="10.99.99.1"
AD_DOMAIN="nexora.example"
AD_NETBIOS="NEXORA"

# ── ISO-Quellen ──────────────────────────────────────────────────────────────
ISO_OPNSENSE_URL="https://mirror.dns-root.de/opnsense/releases/24.1/OPNsense-24.1-dvd-amd64.iso.bz2"
ISO_OPNSENSE="OPNsense-24.1-dvd-amd64.iso"
ISO_WINSERVER_URL=""                # leer = manuell ablegen (EvalCenter-Login noetig)
ISO_WINSERVER="WinServer2022.iso"
ISO_VIRTIO_URL="https://fedorapeople.org/groups/virt/virtio-win/direct-downloads/latest/virtio-win.iso"
ISO_VIRTIO="virtio-win.iso"
IMG_UBUNTU_URL="https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
IMG_UBUNTU="jammy-server-cloudimg-amd64.img"
IMG_KALI_URL=""                     # optional: Kali Generic Cloud Image (.tar.xz / .img)
IMG_KALI=""

# ── VM-Definitionen ──────────────────────────────────────────────────────────
# Format pro VM: VMID | Name | vCPU | RAM(MB) | Disk(GB) | VLAN | IP-Host | Rolle
#   IP-Host = letztes Oktett im jeweiligen VLAN-Netz (z.B. 77 -> 10.99.99.77)
# Linux-VMs (cloud-init, voll automatisch)
LINUX_VMS=(
  "177|wazuh|4|8192|80|${VLAN_SERVERS}|77|wazuh"
  "175|nexora-soc|4|8192|40|${VLAN_SERVERS}|75|soc"
  "103|ollama|4|8192|40|${VLAN_SERVERS}|78|ollama"
  "130|kali|4|4096|40|${VLAN_PENTEST}|30|kali"
)
# Windows-VMs (autounattend, dann guest-exec)
WIN_VMS=(
  "110|DC01|4|8192|60|${VLAN_SERVERS}|10|dc|desktop"
  "111|WEC01|4|4096|60|${VLAN_SERVERS}|11|wec|core"
)
# OPNsense (Sonderfall: 2 NICs, manuelle GUI-Erstkonfig)
OPN_VMID=117
OPN_NAME="OPNsense"
OPN_CORES=2
OPN_RAM=2048
OPN_DISK=20

# ── Verhalten ────────────────────────────────────────────────────────────────
GUEST_EXEC_TIMEOUT=600             # Sekunden, max. Wartezeit auf Guest-Agent
CLOUD_INIT_USER="thorsten"         # Default-Login fuer Linux-VMs
# SSH-Public-Key fuer cloud-init Linux-VMs (Pfad auf dem Proxmox-Host)
SSH_PUBKEY_FILE="/root/.ssh/id_ed25519.pub"

# ── Auto-Doku ────────────────────────────────────────────────────────────────
# Zielverzeichnis fuer generierte Windows-Doku. Leer = automatisch:
#   <repo>/docs/network falls vorhanden, sonst <scripts/lab>/generated-docs
DOC_OUT_DIR=""
# Bei jeder Doku-Generierung automatisch committen (nur wenn im Git-Repo)?
DOC_GIT_COMMIT=0
