<agent_config os="Windows">
  <!--
    Zentrale Agent-Konfiguration für alle Windows-Endpoints.
    Wird vom Wazuh-Manager automatisch auf alle Agents synchronisiert
    die in der Gruppe "default" sind.
    Pfad Manager: /var/ossec/etc/shared/default/agent.conf
  -->

  <!-- Sysmon Enterprise Log-Quelle (bereits konfiguriert, zur Vollständigkeit) -->
  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- PowerShell Operational — wichtig für Script-Block-Logging (Event 4104) -->
  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Windows Defender Operational — Alert-Events -->
  <localfile>
    <location>Microsoft-Windows-Windows Defender/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Task Scheduler Operational — Persistence via Scheduled Tasks -->
  <localfile>
    <location>Microsoft-Windows-TaskScheduler/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- WMI Activity — T1047 WMI Execution -->
  <localfile>
    <location>Microsoft-Windows-WMI-Activity/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- AppLocker (wenn aktiviert) -->
  <localfile>
    <location>Microsoft-Windows-AppLocker/EXE and DLL</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Bits-Client — T1197 BITS Jobs für Download/Persistence -->
  <localfile>
    <location>Microsoft-Windows-Bits-Client/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <!-- Security mit präzisem Filter — kritische Auth-Events behalten -->
  <localfile>
    <location>Security</location>
    <log_format>eventchannel</log_format>
    <query>
      Event/System[
        EventID=4624 or EventID=4625 or EventID=4634 or EventID=4648 or
        EventID=4672 or EventID=4688 or EventID=4698 or EventID=4699 or
        EventID=4700 or EventID=4701 or EventID=4702 or EventID=4719 or
        EventID=4720 or EventID=4722 or EventID=4724 or EventID=4728 or
        EventID=4732 or EventID=4756 or EventID=4768 or EventID=4769 or
        EventID=4771 or EventID=4776 or EventID=4798 or EventID=4799 or
        EventID=5140 or EventID=5145
      ]
    </query>
  </localfile>

  <!-- Syscollector — Hardware, OS, Pakete, Ports, Prozesse, Netzwerk -->
  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <scan_on_start>yes</scan_on_start>
    <hardware>yes</hardware>
    <os>yes</os>
    <network>yes</network>
    <packages>yes</packages>
    <ports all="no">yes</ports>
    <processes>yes</processes>
  </wodle>

  <!-- SCA — Security Configuration Assessment (CIS Benchmark Windows) -->
  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
  </sca>

</agent_config>
