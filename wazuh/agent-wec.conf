<agent_config os="Windows">
  <!--
    ╔══════════════════════════════════════════════════════════════════════════╗
    ║  NEXORA SOC — Agent-Konfiguration für die Gruppe "wec"                   ║
    ║  Nur für Windows Event Collector (WEC01, 10.99.99.11)                     ║
    ║  Pfad Manager: /var/ossec/etc/shared/wec/agent.conf                      ║
    ╚══════════════════════════════════════════════════════════════════════════╝

    WEF-Pipeline:
      DC01 / Clients  ──(WEF, source-initiated)──►  WEC01:ForwardedEvents
      WEC01 Wazuh-Agent liest ForwardedEvents  ──►  Manager (Rules 101200+/101300+)

    Wichtig:
    - Weitergeleitete Events behalten im Event-XML ihren Original-Channel
      (z.B. "Security") und den Original-Computer (z.B. DC01.nexora.example).
      win.system.computer unterscheidet die Quelle, nicht der Agent-Name.
    - KEIN Query-Filter hier: Das Filtern passiert in der WEF-Subscription
      (wef-subscription-dc.xml) — doppelte Filter erzeugen blinde Flecken.

    Setup auf dem Manager:
      mkdir -p /var/ossec/etc/shared/wec
      cp agent-wec.conf /var/ossec/etc/shared/wec/agent.conf
      /var/ossec/bin/agent_groups -a -g wec -q     # Gruppe anlegen
      /var/ossec/bin/agent_groups -a -i <WEC01-ID> -g wec -q
  -->

  <!-- ForwardedEvents — alle per WEF eingesammelten Events (DC01, später Clients) -->
  <localfile>
    <location>ForwardedEvents</location>
    <log_format>eventchannel</log_format>
  </localfile>

</agent_config>
