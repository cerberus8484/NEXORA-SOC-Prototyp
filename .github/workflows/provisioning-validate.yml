name: Provisioning Validate + Plan

# P_GITOPS_3 — read-only. Prüft bei Pull Requests die Node-Profile mit dem
# P_GITOPS_2-Validator und schreibt einen verständlichen Plan/Preview als
# PR-Kommentar. KEIN Apply, kein Deploy, kein Installer, kein Backend-/Remote-Call,
# kein Netzwerk-Touch, kein Wazuh/OPNsense, keine Secrets.

on:
  pull_request:
    paths:
      - "deploy/provisioning/**"
      - "backend/src/provisioning/**"
      - "backend/scripts/validate-node-profiles.js"
      - "backend/scripts/plan-node-profiles.js"

# contents:read = Repo lesen. pull-requests:write = NUR um den Plan-Kommentar zu posten.
permissions:
  contents: read
  pull-requests: write

jobs:
  validate-plan:
    name: Validate + Plan (read-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      # Gate: bricht den Job rot ab, wenn ein Profil ungültig/gefährlich ist.
      - name: Validate node profiles
        working-directory: backend
        run: node scripts/validate-node-profiles.js

      # Plan erzeugen (läuft auch, wenn Validate fehlschlug, um Fehler zu zeigen).
      - name: Generate plan
        if: always()
        working-directory: backend
        run: |
          node scripts/plan-node-profiles.js > "$GITHUB_WORKSPACE/provisioning-plan.md" || true
          cat "$GITHUB_WORKSPACE/provisioning-plan.md" >> "$GITHUB_STEP_SUMMARY"

      # Plan als PR-Kommentar (optional; bei Fork-PRs ohne Schreibrecht still übersprungen).
      - name: Comment plan on PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- nexora-provisioning-plan -->';
            const issue_number = context.issue.number;
            if (!issue_number) return;
            let body;
            try {
              body = fs.readFileSync(process.env.GITHUB_WORKSPACE + '/provisioning-plan.md', 'utf8');
            } catch (e) {
              return; // kein Plan-Output → nichts kommentieren
            }
            const finalBody = marker + '\n' + body;
            const { owner, repo } = context.repo;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find((c) => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: finalBody });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body: finalBody });
            }
