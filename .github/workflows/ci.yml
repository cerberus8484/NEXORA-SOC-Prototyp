name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Keine Secrets nötig: Backend-Tests laufen auf InMemory-Repositories (ohne DB).
permissions:
  contents: read

jobs:
  backend:
    name: Backend (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend (Lint · tsc · Vitest · Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright, mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  e2e-real:
    name: E2E (echtes Backend, InMemory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e:real
        working-directory: frontend

  web-headers:
    name: Web Headers (nginx · CSP/HSTS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: TLS-Zertifikat für Test erzeugen
        run: |
          mkdir -p .tmp/ci-certs
          openssl req -x509 -nodes -newkey rsa:2048 \
            -keyout .tmp/ci-certs/server.key \
            -out .tmp/ci-certs/server.crt \
            -days 1 \
            -subj "/CN=localhost"

      - name: Web-Image bauen
        run: docker build -f frontend/Dockerfile --target web -t nexora-web-csp-ci .

      - name: Web-Container starten
        run: |
          docker run -d --rm \
            --name nexora-web-csp-ci \
            --add-host api:127.0.0.1 \
            -p 18443:443 \
            -v "${{ github.workspace }}/.tmp/ci-certs/server.crt:/etc/ssl/certs/server.crt:ro" \
            -v "${{ github.workspace }}/.tmp/ci-certs/server.key:/etc/ssl/private/server.key:ro" \
            nexora-web-csp-ci

      - name: Auf nginx warten
        run: |
          for i in $(seq 1 30); do
            if curl -kfsS https://localhost:18443/nginx-health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "nginx ist nicht rechtzeitig hochgekommen"
          docker logs nexora-web-csp-ci || true
          exit 1

      - name: CSP/HSTS-Smoke fahren
        run: SOC_SMOKE_BASE_URL=https://localhost:18443 sh deploy/smoke-csp.sh

      - name: Container-Logs bei Fehlern
        if: failure()
        run: docker logs nexora-web-csp-ci || true

      - name: Web-Container stoppen
        if: always()
        run: docker stop nexora-web-csp-ci || true
