name: 🐞 Bug Report
description: Einen Fehler melden / Report a bug
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Danke für den Report! Bitte **keine Secrets, Tokens oder echten personenbezogenen Daten** einfügen.
        Sicherheitslücken bitte **nicht** hier melden, sondern gemäß [SECURITY.md](../SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: Was ist passiert?
      description: Klare Beschreibung des Fehlverhaltens.
      placeholder: Beim Anlegen eines Tickets …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Erwartetes Verhalten
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      placeholder: |
        1. Gehe zu '…'
        2. Klicke auf '…'
        3. Fehler erscheint
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Betroffener Bereich
      options:
        - Backend (API / Express)
        - Frontend (React)
        - Threat Hunting
        - KI-Agent / LLM
        - SIEM-Integration (Wazuh/QRadar/Splunk)
        - Auth / Security
        - Deployment / Docker
        - Doku
        - Sonstiges
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Umgebung
      description: Version/Commit, Browser, OS, DB_ENABLED ja/nein.
      placeholder: "commit ce583dc · Chrome 124 · Win11 · DB_ENABLED=true"
  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Relevante Log-Ausschnitte (Secrets entfernen!).
      render: shell
